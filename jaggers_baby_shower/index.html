opener noreferrer" aria-label="Open baby registry"></a><a class="hotspot rsvp" href="#rsvp-form" aria-label="RSVP on this website"></a><a class="hotspot return" href="#photo-booth" aria-label="Return to photo booth"></a></section><section class="rsvp-page" id="rsvp-form" hidden aria-labelledby="rsvp-title"><h2 class="rsvp-heading" id="rsvp-title">RSVP for Jagger's Baby Shower</h2><iframe class="rsvp-iframe" src="https://f4jm9gtgyc-ui.github.io/homestead_hub/jagger_rsvp/" title="Jagger's baby shower RSVP form" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></section></main><script>
(function(){
 const intro=document.getElementById('intro');
 const website=document.getElementById('website');
 const openButton=document.getElementById('open-envelope');
 let opened=false;
 function revealWebsite(){opened=true;website.hidden=false;intro.hidden=true;show('photo-booth',true);}
 openButton.addEventListener('click',()=>{
   if(opened||intro.classList.contains('opening'))return;
   intro.classList.add('opening');
   setTimeout(()=>intro.classList.add('leaving'),1250);
   setTimeout(revealWebsite,2020);
 });

 const rsvpFrame=document.querySelector('.rsvp-iframe');
 function adaptEmbeddedRSVP(){
   try{
     const doc=rsvpFrame.contentDocument;
     if(!doc || !doc.body)return;
     const fixReturnLinks=()=>{
       doc.querySelectorAll('a.return-link').forEach(link=>{
         link.href='https://f4jm9gtgyc-ui.github.io/homestead_hub/jaggers_baby_shower/#invitation';
         link.target='_top';
         link.rel='noopener';
       });
     };
     fixReturnLinks();
     if(!rsvpFrame._linkObserver && typeof MutationObserver!=='undefined'){
       rsvpFrame._linkObserver=new MutationObserver(fixReturnLinks);
       rsvpFrame._linkObserver.observe(doc.body,{subtree:true,childList:true});
     }
     const adjust=()=>{
       const height=Math.ceil(Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight));
       if(height>200)rsvpFrame.style.height=(height+8)+'px';
     };
     adjust();
     if(!rsvpFrame._resizeObserver && typeof ResizeObserver!=='undefined'){
       rsvpFrame._resizeObserver=new ResizeObserver(adjust);
       rsvpFrame._resizeObserver.observe(doc.querySelector('.card')||doc.body);
     }
   }catch(err){/* Standalone file previews are cross-origin; published GitHub Pages is same-origin. */}
 }
 rsvpFrame.addEventListener('load',adaptEmbeddedRSVP);
 const ids=['photo-booth','invitation','rsvp-form'];
 const pages=ids.map(id=>document.getElementById(id));
 function show(id,updateHistory){
   if(!ids.includes(id))id='photo-booth';
   pages.forEach(page=>{page.hidden=page.id!==id;});
    const invitation=document.getElementById('invitation');
    invitation.classList.remove('page-enter');
    if(id==='invitation'){void invitation.offsetWidth;invitation.classList.add('page-enter');}
   document.body.dataset.page=id;
   if(updateHistory)history.pushState({page:id},'', '#'+id);
   window.scrollTo(0,0);
   document.title=(id==='photo-booth'?'Photo Booth':id==='invitation'?'Invitation Details':'RSVP')+' | Jagger’s Baby Shower';
 }
 document.addEventListener('click',event=>{
   const anchor=event.target.closest('a[href^="#"]');
   if(!anchor)return;
   const id=decodeURIComponent(anchor.getAttribute('href').slice(1));
   if(!ids.includes(id))return;
   event.preventDefault();show(id,true);
 });
 window.addEventListener('popstate',()=>show(decodeURIComponent(location.hash.slice(1)),false));
 window.addEventListener('hashchange',()=>show(decodeURIComponent(location.hash.slice(1)),false));
 if(['photo-booth','invitation','rsvp-form'].includes(decodeURIComponent(location.hash.slice(1)))){
   opened=true;intro.hidden=true;website.hidden=false;
   show(decodeURIComponent(location.hash.slice(1)),false);
 }else{
   pages.forEach(page=>{page.hidden=page.id!=='photo-booth';});
 }
})();
